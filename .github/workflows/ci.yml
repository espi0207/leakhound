name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # el historial completo, para la prueba del final
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Pruebas (pytest, con una pantalla virtual para la ventana)
        run: |
          command -v xvfb-run >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)
          xvfb-run -a pytest -q
      - name: leakhound sobre su propio repositorio
        run: leakhound history .
