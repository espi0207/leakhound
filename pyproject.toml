[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leakhound"
version = "1.0.0"
description = "Busca contraseñas, claves de API y tokens en el código y en el historial de git"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "espi0207" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.9"]

[project.scripts]
leakhound = "leakhound.__main__:main"

[project.gui-scripts]
leakhound-app = "leakhound.gui:main"

[tool.setuptools]
packages = ["leakhound"]

[tool.setuptools.package-data]
leakhound = ["icon.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
